[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rzpulse"
version = "0.1.0"
description = "Independent read-only Razorpay terminal explorer"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["textual>=1,<9", "rich>=13", "httpx>=0.27,<1", "pydantic>=2,<3", "python-dotenv>=1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9"]

[project.scripts]
rzpulse = "rzpulse.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
